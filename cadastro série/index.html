<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Séries</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="caixa">  
        <h1>CADASTRO DE SÉRIES</h1>

        <br>

         TÍTULO: 
        <input type="text" id="titulo" id="titulo=da=serie" required> 

        <br><br> 

        QTD EPISÓDIOS: 
        <input type="number" id="episodios" id="numero=de=episodios" required> 

        <br><br> 
        
        DESCRIÇÃO:
        <input type="text" id="descricao" id="descricao=da=serie" required> 

        <br><br>

        AUTOR:
        <input type="text" id="autor" id="nome=do=autor" required>

        <br><br><br> 

        <button type="button" 
        onClick="cadastrar()">
        CADASTRAR-SE 
    </button>

    </div>

    <script src="./js/script.js"></script>

</body>

</html>
